services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newtonite
      POSTGRES_USER: ${DB_USER:-newtonite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newtonite}
    ports:
      - "${DB_PORT:-5433}:5432"   # 5433 avoids clashing with a locally installed PostgreSQL
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d newtonite"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/newtonite
      DB_USER: ${DB_USER:-newtonite}
      DB_PASSWORD: ${DB_PASSWORD:-newtonite}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789abcdef}
    ports:
      - "${API_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  db-data:
